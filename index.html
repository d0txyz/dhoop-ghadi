<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dhoop Ghadi: safe work hours in the heat</title>
  <meta name="description" content="Free tool for India's outdoor workers: which hours are safe to work today and tomorrow in extreme heat, in six languages.">
  <meta name="theme-color" content="#1B1612">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231B1612'/%3E%3Cpath d='M32 32 L32 8 A24 24 0 0 1 56 32 Z' fill='%23E8730C'/%3E%3Cpath d='M32 32 L8 32 A24 24 0 0 1 32 8 Z' fill='%231E8E5A'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#1B1612"/>
        <path d="M32 32 L32 8 A24 24 0 0 1 56 32 Z" fill="#E8730C"/>
        <path d="M32 32 L8 32 A24 24 0 0 1 32 8 Z" fill="#1E8E5A"/>
      </svg>
      <div>
        <h1 id="appName">धूप घड़ी</h1>
        <p id="tagline" class="tagline">गर्मी में काम के सुरक्षित घंटे</p>
      </div>
    </div>
    <select id="lang" class="lang" aria-label="Language"></select>
  </header>

  <main>
    <section class="controls" aria-label="Choices">
      <div class="field">
        <label for="place" id="placeLabel">जगह</label>
        <select id="place"></select>
        <div class="finder">
          <input id="placeQuery" type="search" autocomplete="off" enterkeyhint="search">
          <button id="placeSearch" type="button" class="ghost"></button>
          <button id="placeGps" type="button" class="ghost"></button>
        </div>
        <ul id="placeResults" class="results" hidden></ul>
        <p id="placeMsg" class="msg" hidden></p>
      </div>

      <div class="field">
        <span class="label" id="workLabel">काम</span>
        <div id="work" class="chips" role="radiogroup" aria-labelledby="workLabel"></div>
      </div>

      <label class="check">
        <input id="newWorker" type="checkbox">
        <span id="newWorkerLabel"></span>
      </label>

      <div id="day" class="days" role="tablist"></div>
    </section>

    <p id="sampleNote" class="samplenote" hidden></p>
    <section id="status" class="status" aria-live="polite"></section>

    <section id="result" hidden>
      <article class="plan" id="planCard">
        <p class="eyebrow"><span id="planTitle"></span> <span id="planWhere"></span></p>
        <p id="headline" class="headline"></p>
        <p id="rest" class="rest"></p>
        <p id="short" class="short"></p>
        <div class="actions">
          <a id="share" class="btn primary" target="_blank" rel="noopener"></a>
          <button id="listen" type="button" class="btn"></button>
        </div>
      </article>

      <section class="block">
        <h2 id="dialTitle"></h2>
        <div class="dialwrap">
          <svg id="dial" viewBox="0 0 320 320" role="img"></svg>
        </div>
        <ul id="legend" class="legend"></ul>
        <p id="peak" class="peak"></p>
      </section>

      <section class="block">
        <h2 id="rulesTitle"></h2>
        <p id="rule" class="rule"></p>
        <p id="water" class="rule water"></p>
      </section>

      <section class="block usual">
        <h2 id="usualTitle"></h2>
        <div id="usualBar" class="bar" aria-hidden="true"></div>
        <p id="usual"></p>
      </section>

      <p id="danger" class="danger"></p>
    </section>
  </main>

  <footer>
    <p id="note"></p>
    <p class="links">
      <a id="impactLink" href="impact.html"></a>
      <a id="methodLink" href="method.html"></a>
      <a id="sourceLink" href="https://github.com/d0txyz/dhoop-ghadi"></a>
    </p>
    <p class="credit">Off Hours · d0t · MIT · Weather: Open-Meteo</p>
  </footer>

  <script type="module" src="src/app.js"></script>
</body>
</html>
